<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4ead5">
<title>حيّه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #f4ead5;
    --tile-a: #f9f1de;
    --tile-b: #f0e3c4;
    --ink: #1e6b46;
    --ink-dark: #13492f;
    --accent: #c8512b;
    --text: #3b2a1a;
    --muted: #8a7559;
    --card: #fffaf0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--sand); color: var(--text); overflow: hidden; overscroll-behavior: none; }
  body { font-family: 'Tajawal', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }

  #app {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 10px);
    touch-action: none;
  }

  /* HUD */
  #hud { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 10px; padding-bottom: 8px; }
  .stat { display: flex; flex-direction: column; line-height: 1.1; min-width: 52px; }
  .stat span { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stat b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .slow { background: #6b3f1f; color: #fff; border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 15px; }
  .spacer { flex: 1; }
  .icon { width: 44px; height: 44px; border-radius: 12px; background: var(--card); box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 2px 6px rgba(80,50,10,.12); display: grid; place-items: center; }
  .icon svg { width: 22px; height: 22px; fill: var(--text); }

  /* Board */
  #boardWrap { flex: 1; min-height: 0; width: 100%; max-width: 520px; display: flex; align-items: center; justify-content: center; }
  #board { display: block; border-radius: 12px; box-shadow: 0 2px 10px rgba(80,50,10,.18); outline: 3px solid var(--ink-dark); }
  #board.wrap { outline-style: dashed; outline-color: #a88f68; }


  /* Screens */
  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    background: rgba(244, 234, 213, .88);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    overflow-y: auto; touch-action: pan-y;
  }
  .screen[hidden] { display: none; }
  .card {
    width: 100%; max-width: 400px; margin: auto;
    background: var(--card); border-radius: 22px; padding: 24px 20px;
    box-shadow: 0 8px 30px rgba(80,50,10,.18);
    display: flex; flex-direction: column; gap: 12px; text-align: center;
  }
  .eyebrow { font-size: 14px; color: var(--muted); font-weight: 800; }
  .name {
    font-family: 'Reem Kufi', 'Tajawal', sans-serif; font-weight: 700; color: var(--ink);
    font-size: 56px; line-height: 1.5; min-height: 1.5em; word-break: break-all;
  }
  .lead { font-size: 15px; color: var(--text); line-height: 1.7; }
  .lead .k { font-family: 'Reem Kufi', sans-serif; color: var(--ink); font-weight: 700; }
  .preview { display: block; font-size: 30px; line-height: 1.6; min-height: 1.6em; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800; color: var(--muted); }
  .field input {
    font: 800 24px 'Tajawal', sans-serif; color: var(--ink-dark); text-align: center;
    padding: 10px 14px; border: 0; border-radius: 14px; outline: none;
    background: #f6ecd6; box-shadow: inset 0 0 0 2px #e6d4ae;
    user-select: text; -webkit-user-select: text;
  }
  .field input:focus { box-shadow: inset 0 0 0 2px var(--ink); }
  .field input::placeholder { color: #bba887; font-weight: 500; }
  .msg { font-size: 13px; font-weight: 800; color: var(--accent); }
  .version { font-size: 12px; font-weight: 500; color: var(--muted); margin-top: -14px; }
  .msg[hidden] { display: none; }
  .modes { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .mode {
    display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: right;
    padding: 12px 16px; border-radius: 16px; background: #f6ecd6;
    box-shadow: inset 0 0 0 2px #e6d4ae;
  }
  .mode:active { background: #efe0bf; }
  .m-name { font-size: 22px; font-weight: 800; color: var(--ink-dark); }
  .m-desc { grid-column: 1; font-size: 13px; color: var(--muted); }
  .m-best { grid-column: 2; grid-row: 1 / span 2; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.2; }
  .m-best b { display: block; font-size: 22px; color: var(--text); }
  .howto { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .primary, .secondary, .ghost { min-height: 50px; border-radius: 14px; font-size: 18px; font-weight: 800; }
  .primary { background: var(--ink); color: #fff; box-shadow: 0 3px 0 var(--ink-dark); }
  .primary:active { transform: translateY(2px); box-shadow: none; }
  .secondary { background: #25d366; color: #fff; box-shadow: 0 3px 0 #1a9e4c; }
  .secondary:active { transform: translateY(2px); box-shadow: none; }
  .ghost { color: var(--muted); font-size: 16px; min-height: 44px; }
  .stats { display: flex; gap: 10px; }
  .stats div { flex: 1; background: #f6ecd6; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; }
  .stats span { font-size: 13px; color: var(--muted); }
  .stats b { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .badge { background: #fff1c2; color: #8a5a00; border-radius: 12px; padding: 8px; font-weight: 800; }
  .badge[hidden] { display: none; }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat"><span>النقاط</span><b id="score">0</b></div>
    <div class="stat"><span>الأفضل</span><b id="best">0</b></div>
    <div id="slow" class="slow" hidden>☕ <span id="slowN">5</span></div>
    <div class="spacer"></div>
    <button id="mute" class="icon" aria-label="الصوت"></button>
    <button id="pauseBtn" class="icon" aria-label="إيقاف مؤقت">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
  </header>

  <div id="boardWrap"><canvas id="board"></canvas></div>
</div>

<section id="start" class="screen">
  <div class="card">
    <div class="name">حَــيَّـــه</div>
    <div class="version" dir="ltr">version 1.3.27</div>
    <label class="field">
      <span>اكتب اسمًا بالعربي</span>
      <input id="nameInput" type="text" dir="rtl" lang="ar" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="مثلًا: محمد">
    </label>
    <div id="nameMsg" class="msg" hidden></div>
    <p class="lead">كلما أكل <b id="leadName">سعد</b> شيئًا طال اسمه:<span id="namePreview" class="k preview">سعد</span></p>
    <div class="modes">
      <button class="mode" data-mode="easy">
        <span class="m-name">سهل</span>
        <span class="m-best">الأفضل<b id="best-easy">0</b></span>
        <span class="m-desc">أبطأ، والجدار يعيدك من الجهة الأخرى</span>
      </button>
      <button class="mode" data-mode="normal">
        <span class="m-name">عادي</span>
        <span class="m-best">الأفضل<b id="best-normal">0</b></span>
        <span class="m-desc">لمس الجدار ينهي اللعبة</span>
      </button>
      <button class="mode" data-mode="hard">
        <span class="m-name">صعب</span>
        <span class="m-best">الأفضل<b id="best-hard">0</b></span>
        <span class="m-desc">أسرع، مع صخور في الطريق</span>
      </button>
    </div>
    <p class="howto">المس يمين الشاشة ليلتفّ الثعبان مع عقارب الساعة ↻<br>والمس يسارها ليلتفّ عكس عقارب الساعة ↺<br>☕ القهوة تبطّئه خمس ثوانٍ.</p>
  </div>
</section>

<section id="pause" class="screen" hidden>
  <div class="card">
    <div class="name" style="font-size:40px">استراحة</div>
    <button id="resume" class="primary">أكمل اللعب</button>
    <button id="pauseMenu" class="ghost">القائمة</button>
  </div>
</section>

<section id="over" class="screen" hidden>
  <div class="card">
    <div id="overTitle" class="eyebrow">انتهت اللعبة</div>
    <div id="overName" class="name"></div>
    <div id="newBest" class="badge" hidden>🎉 رقم قياسي جديد!</div>
    <div class="stats">
      <div><span>النتيجة</span><b id="overScore">0</b></div>
      <div><span id="overBestLabel">الأفضل</span><b id="overBest">0</b></div>
    </div>
    <button id="again" class="primary">العب مرة أخرى</button>
    <button id="share" class="secondary">شارك النتيجة</button>
    <button id="overMenu" class="ghost">القائمة</button>
  </div>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // Saved settings: wrapped so private browsing or blocked storage never breaks the game.
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  const MODES = {
    easy:   { name: 'سهل',  start: 190, min: 120, dec: 2,   wrap: true,  rocks: 0 },
    normal: { name: 'عادي', start: 150, min: 80,  dec: 2.5, wrap: false, rocks: 0 },
    hard:   { name: 'صعب',  start: 115, min: 60,  dec: 2.5, wrap: false, rocks: 7 },
  };
  const FRUITS = ['🍎', '🍇', '🍉', '🍓', '🍌', '🍊', '🥭', '🍒', '🍑', '🍍', '🍐', '🥝'];
  const BURST = ['#e74c3c', '#f39c12', '#8e44ad', '#27ae60', '#e67e22'];
  const COLS = 12;
  const SLOW_MS = 5000, COFFEE_MS = 8000;
  const TATWEEL = 'ـ', ZWJ = '‍';
  // Arabic joining: these letters connect on both sides; these only to the letter before them
  // (so no ـ can follow them); ء connects to nothing.
  const DUAL = 'بتثجحخسشصضطظعغفقكلمنهيئى', RIGHT = 'اأإآدذرزوؤة';
  const joinsAfter = ch => ch === TATWEEL || DUAL.includes(ch);
  const joinsBefore = ch => ch === TATWEEL || DUAL.includes(ch) || RIGHT.includes(ch);
  const MAX_NAME = 12, BULGE_STEP = 1.5;   // how many letters a swallowed lump slides down per step
  const SNAKE_FONT = '"Reem Kufi", "Noto Kufi Arabic", Tahoma, sans-serif';
  const EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
  const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
  const INK = '#1e6b46', DEAD = '#b23a2a';

  const canvas = $('board'), ctx = canvas.getContext('2d');
  let cell = 20, rows = 20, W = 0, H = 0, M = null;
  let S = null;
  let muted = store.get('saad.muted', false);
  const best = Object.assign({ easy: 0, normal: 0, hard: 0 }, store.get('saad.best', {}));
  let audio = null;

  const rand = n => Math.floor(Math.random() * n);
  const same = (a, b) => a && b && a.x === b.x && a.y === b.y;
  const center = p => ({ x: p.x * cell + cell / 2, y: p.y * cell + cell / 2 });

  // ---------- names ----------
  // Keep Arabic letters only; harakat and ـ are dropped quietly.
  const stripMarks = s => s.replace(/[ً-ٰٟـ]/g, '');
  const cleanName = s => stripMarks(s).replace(/[^ء-غف-ي]/g, '').slice(0, MAX_NAME);

  // Where the ـ go: every gap between two letters that join, nearest the head (end of the name)
  // first. Gap k sits between letter k-1 and letter k. A name with no such gap (داود) stretches
  // from its start instead (gap 0).
  function stretchSpots(name) {
    const spots = [];
    for (let k = name.length - 1; k >= 1; k--) if (joinsAfter(name[k - 1]) && joinsBefore(name[k])) spots.push(k);
    return spots.length ? spots : [0];
  }

  // The name in reading order with runs[k] ـ before letter k, each piece knowing whether it
  // joins the next piece (ja) and the joined shape to draw it with (g).
  function layout(name, runs) {
    const out = [];
    for (let k = 0; k < name.length; k++) {
      for (let r = runs[k] || 0; r > 0; r--) out.push({ ch: TATWEEL, letter: false });
      out.push({ ch: name[k], letter: true, k });
    }
    out.forEach((it, j) => {
      const prev = out[j - 1], next = out[j + 1];
      const jb = !!prev && joinsAfter(prev.ch) && joinsBefore(it.ch);
      it.ja = !!next && joinsAfter(it.ch) && joinsBefore(next.ch);
      it.g = (jb ? ZWJ : '') + it.ch + (it.ja ? ZWJ : '');
    });
    return out;
  }

  // The name after eating t things, handing the ـ out to the spots in turn.
  function stretched(name, t) {
    const spots = stretchSpots(name), runs = {};
    for (let i = 0; i < Math.min(t, 40); i++) { const s = spots[i % spots.length]; runs[s] = (runs[s] || 0) + 1; }
    return layout(name, runs).map(it => it.ch).join('');
  }

  // ---------- sizing ----------
  function fitBoard(newGame) {
    const wrap = $('boardWrap');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (newGame) {
      const c = Math.floor(w / COLS);
      rows = Math.max(12, Math.min(24, Math.floor(h / c)));
    }
    cell = Math.max(10, Math.floor(Math.min(w / COLS, h / rows)));
    W = cell * COLS; H = cell * rows;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    M = measure();
  }

  // Find where the font's tatweel bar sits, so the body line and the letters join up.
  function measure() {
    const fs = Math.round(cell * 1.25);
    ctx.font = `400 ${fs}px ${SNAKE_FONT}`;
    const m = ctx.measureText(TATWEEL);
    let asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
    let t = asc + desc;
    if (!(t > 0) || t > cell) { t = cell * 0.12; asc = fs * 0.12; desc = asc - t; }
    // The body line is exactly as thick as the font's own ـ, so it runs straight into the letters.
    return { fs, offY: (asc - desc) / 2, body: Math.max(t, cell * 0.1), sx: {}, ink: {} };
  }
  // How much to squeeze a letter wider than one cell (letters are never widened).
  function glyphScale(g) {
    if (!(g in M.sx)) {
      ctx.font = `400 ${M.fs}px ${SNAKE_FONT}`;
      M.sx[g] = Math.max(0.55, Math.min(1, cell / (ctx.measureText(g).width || cell)));
    }
    return M.sx[g];
  }
  // How far a letter's ink reaches toward the head and toward the tail, in cells.
  function glyphInk(g) {
    if (!(g in M.ink)) {
      const k = glyphScale(g) / cell;
      ctx.font = `400 ${M.fs}px ${SNAKE_FONT}`;
      ctx.textAlign = 'center';
      const m = ctx.measureText(g);
      M.ink[g] = { head: m.actualBoundingBoxLeft * k, tail: m.actualBoundingBoxRight * k };
    }
    return M.ink[g];
  }

  // ---------- sound & vibration ----------
  function initAudio() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      loadTaunts();
    } catch (e) {}
  }
  function tone(f1, f2, dur, type, vol, delay) {
    if (muted || !audio) return;
    const t = audio.currentTime + (delay || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const sfx = {
    eat()    { tone(520, 880, 0.09, 'triangle', 0.22); },
    coffee() { tone(440, 330, 0.12, 'sine', 0.2); tone(660, 440, 0.16, 'sine', 0.16, 0.1); },
    over()   { tone(380, 80, 0.55, 'sawtooth', 0.12); },
    best()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, 0.16, 'triangle', 0.16, i * 0.11)); },
    tap()    { tone(660, 0, 0.04, 'square', 0.05); },
  };
  function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // Losing gets a taunt: a voice (يا غشيم، يا سعد…) and then a cartoon laugh, both picked at
  // random. A short laugh is followed by another, so the taunt lasts from the crash until a
  // couple of seconds into the game-over screen. Loaded once sound is allowed (first tap);
  // until they arrive, losing just plays the tone.
  const SAYS = ['ghashim', 'hataf', 'sabak', 'dalakh', 'fashil', 'loser', 'saad'];
  const LAUGHS = ['monkey', 'hyena', 'giggle', 'cartoon'];   // from mixkit.co (free licence)
  const TAUNT_SECS = 2.2;
  let clips = null, lastSay = '';
  function loadTaunts() {
    if (clips || !audio) return;
    clips = {};
    SAYS.map(n => 'say-' + n).concat(LAUGHS.map(n => 'laugh-' + n)).forEach(name => {
      fetch(`sounds/${name}.mp3`).then(r => r.arrayBuffer()).then(b => audio.decodeAudioData(b))
        .then(buf => { clips[name] = buf; }).catch(() => {});
    });
  }
  // Pick a loaded clip from a list at random, skipping the ones named in `not`.
  function pickClip(prefix, names, not) {
    const ready = names.map(n => prefix + n).filter(n => clips[n] && !not.includes(n));
    return ready.length ? ready[rand(ready.length)] : null;
  }
  // Returns how long the taunt lasts, in seconds (0 if none played).
  function taunt() {
    if (muted || !audio || !clips) return 0;
    const say = pickClip('say-', SAYS, [lastSay]) || pickClip('say-', SAYS, []);
    if (!say) return 0;
    lastSay = say;
    const order = [say];
    let total = clips[say].duration;
    for (let laugh; total < TAUNT_SECS && (laugh = pickClip('laugh-', LAUGHS, order)); total += clips[laugh].duration + 0.05)
      order.push(laugh);
    const g = audio.createGain();
    g.gain.value = 0.8; g.connect(audio.destination);
    let t = audio.currentTime;
    order.forEach(name => {
      const src = audio.createBufferSource();
      src.buffer = clips[name]; src.connect(g); src.start(t);
      t += clips[name].duration + 0.05;
    });
    return t - audio.currentTime;
  }

  function renderMute() {
    $('mute').innerHTML = muted
      ? '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#3b2a1a" stroke-width="2" stroke-linecap="round"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="#3b2a1a" stroke-width="2" stroke-linecap="round"/></svg>';
  }

  // ---------- game ----------
  function newGame(modeKey, name) {
    initAudio();
    show(null);
    fitBoard(true);
    const mode = MODES[modeKey];
    // The head is the name's last letter, so the name lies along the row reading right to left;
    // a long name bends down at the right-hand wall.
    const n = name.length, y = Math.floor(rows / 2), x = COLS / 2 - 1;
    const spots = stretchSpots(name), runs = {};
    spots.forEach(s => { runs[s] = 0; });
    S = {
      modeKey, mode, name, spots, runs, items: layout(name, runs).reverse(),
      snake: Array.from({ length: n }, (_, i) => ({ x: Math.min(COLS - 1, x + i), y: y + Math.max(0, x + i - (COLS - 1)) })),
      // prevTail: the cell the tail just left; grewAt: the snake index where a ـ was just added
      // (pieces from there back stay still while the front glides on).
      prevTail: null, grewAt: 0, bulges: [], settling: null, mouth: 0, slide: {},
      dir: DIRS.left, lastDir: DIRS.left, queue: [],
      food: null, coffee: null, rocks: [],
      score: 0, eaten: 0, slowLeft: 0, acc: 0, last: performance.now(),
      state: 'run', deadAt: 0, won: false, particles: [], floaters: [],
    };
    canvas.classList.toggle('wrap', mode.wrap);
    shownSlow = 0; $('slow').hidden = true;
    placeRocks();
    spawnFood(performance.now());
    updateHud();
  }

  function occupied(p) {
    return S.snake.some(s => same(s, p)) || S.rocks.some(r => same(r, p)) || same(S.food, p) || same(S.coffee, p);
  }
  function emptyCell() {
    const free = [];
    for (let y = 0; y < rows; y++) for (let x = 0; x < COLS; x++) if (!occupied({ x, y })) free.push({ x, y });
    return free.length ? free[rand(free.length)] : null;
  }
  function placeRocks() {
    const sy = S.snake[0].y;
    let tries = 0;
    while (S.rocks.length < S.mode.rocks && tries++ < 500) {
      const p = { x: rand(COLS), y: rand(rows) };
      if (Math.abs(p.y - sy) <= 1 || occupied(p)) continue;
      S.rocks.push(p);
    }
  }
  function spawnFood(now) {
    const p = emptyCell();
    S.food = p ? { x: p.x, y: p.y, ch: FRUITS[rand(FRUITS.length)], born: now } : null;
  }
  function maybeCoffee(now) {
    if (S.coffee || S.eaten < 3 || Math.random() > 0.22) return;
    const p = emptyCell();
    if (p) S.coffee = { x: p.x, y: p.y, left: COFFEE_MS, born: now };
  }

  function turn(name) {
    if (!S || S.state !== 'run') return;
    const d = DIRS[name];
    const prev = heading();
    if ((d.x === -prev.x && d.y === -prev.y) || (d.x === prev.x && d.y === prev.y)) return;
    if (S.queue.length < 3) S.queue.push(d);
  }

  // Turn to the snake's own left or right, relative to where it is (or is about to be) heading.
  function turnSide(side) {
    if (!S || S.state !== 'run' || S.queue.length >= 3) return;
    const p = heading();
    S.queue.push(side === 'left' ? { x: p.y, y: -p.x } : { x: -p.y, y: p.x });
  }

  function heading() { return S.queue.length ? S.queue[S.queue.length - 1] : S.dir; }

  function interval() {
    const base = Math.max(S.mode.min, S.mode.start - S.eaten * S.mode.dec);
    return S.slowLeft > 0 ? base * 1.7 : base;
  }

  // Snake index where the next ـ for a spot goes: the middle of that spot's stretch, just
  // behind (tail side of) the letter the stretch sits before.
  function target(spot) {
    let pos = S.runs[spot];
    for (let k = 0; k < spot; k++) pos += 1 + (S.runs[k] || 0);
    return S.snake.length - pos + Math.floor(S.runs[spot] / 2);
  }

  // Spread the ـ between the spots, counting food still on its way down.
  function pickSpot() {
    let best = S.spots[0], fewest = Infinity;
    for (const s of S.spots) {
      const n = S.runs[s] + S.bulges.filter(b => b.spot === s).length;
      if (n < fewest) { best = s; fewest = n; }
    }
    return best;
  }

  function step(now) {
    if (S.queue.length) S.dir = S.queue.shift();
    const h = S.snake[0];
    let nx = h.x + S.dir.x, ny = h.y + S.dir.y;
    if (S.mode.wrap) { nx = (nx + COLS) % COLS; ny = (ny + rows) % rows; }
    else if (nx < 0 || ny < 0 || nx >= COLS || ny >= rows) return die(now);
    const next = { x: nx, y: ny };
    const eatsFood = same(S.food, next), eatsCoffee = same(S.coffee, next);
    // Swallowed food travels down the body; the name grows only once a lump reaches the tummy.
    const arrived = S.bulges.find(b => b.b + BULGE_STEP >= target(b.spot));
    // The tail moves out of the way this step unless the snake is growing.
    const body = arrived ? S.snake : S.snake.slice(0, -1);
    if (body.some(p => same(p, next)) || S.rocks.some(r => same(r, next))) return die(now);

    const grewAt = arrived ? target(arrived.spot) : Infinity;
    S.bulges.forEach(b => { if (b.b < 0) swallowed(b, now); b.b += BULGE_STEP; });
    S.snake.unshift(next);
    S.lastDir = S.dir;
    S.grewAt = grewAt;
    S.settling = arrived ? grewAt : null;   // the lump fades there while the new ـ opens up
    if (arrived) {
      S.runs[arrived.spot]++;
      S.items = layout(S.name, S.runs).reverse();
      S.bulges.splice(S.bulges.indexOf(arrived), 1);
      S.prevTail = null;
    } else {
      S.prevTail = S.snake.pop();
    }

    if (eatsFood || eatsCoffee) {
      // In its mouth now; it reaches the head (and crunches) at the end of this step's glide.
      S.bulges.push({ b: -BULGE_STEP, spot: pickSpot(), ch: eatsFood ? S.food.ch : '☕', coffee: eatsCoffee, cell: next });
      S.score++;
    }
    if (eatsFood) {
      S.eaten++;
      spawnFood(now);
      maybeCoffee(now);
      if (!S.food && !emptyCell()) { S.won = true; return die(now); }
    } else if (eatsCoffee) {
      S.coffee = null; S.slowLeft = SLOW_MS;
    }
    updateHud();
  }

  function swallowed(b, now) {
    if (b.coffee) {
      burst(b.cell, now, ['#6b3f1f', '#a0703f', '#d9b48f']); floater(b.cell, 'أبطأ!', now);
      sfx.coffee(); vib([20, 40, 20]);
    } else {
      burst(b.cell, now); floater(b.cell, '+1', now);
      sfx.eat(); vib(25);
    }
  }

  function die(now) {
    S.state = 'dead'; S.deadAt = now;
    const said = S.won ? 0 : taunt();
    if (!said) sfx.over();
    vib([90, 60, 160]);
    const isBest = S.score > 0 && S.score > (best[S.modeKey] || 0);
    if (isBest) { best[S.modeKey] = S.score; store.set('saad.best', best); }
    setTimeout(() => showGameOver(isBest, said), 750);
  }

  function burst(p, now, colors) {
    const c = center(p);
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, v = 0.04 + Math.random() * 0.08;
      S.particles.push({ x: c.x, y: c.y, vx: Math.cos(a) * v * cell, vy: Math.sin(a) * v * cell, born: now,
        color: (colors || BURST)[rand((colors || BURST).length)] });
    }
  }
  function floater(p, text, now) { const c = center(p); S.floaters.push({ x: c.x, y: c.y, text, born: now }); }

  // ---------- drawing ----------
  function drawBoard() {
    ctx.fillStyle = getVar('--tile-a');
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = getVar('--tile-b');
    for (let y = 0; y < rows; y++) for (let x = (y % 2); x < COLS; x += 2) ctx.fillRect(x * cell, y * cell, cell, cell);
  }
  const varCache = {};
  function getVar(n) { return varCache[n] || (varCache[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim()); }

  function drawRock(p) {
    const x = p.x * cell, y = p.y * cell, r = cell * 0.25, i = cell * 0.08;
    ctx.fillStyle = '#8f7f68';
    roundRect(x + i, y + i, cell - 2 * i, cell - 2 * i, r); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    roundRect(x + i * 2, y + i * 2, cell * 0.45, cell * 0.22, r * 0.6); ctx.fill();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawEmoji(ch, p, scale) {
    const c = center(p);
    ctx.save();
    ctx.translate(c.x, c.y); ctx.scale(scale, scale);
    ctx.font = `${Math.round(cell * 0.82)}px ${EMOJI_FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, cell * 0.05);
    ctx.restore();
  }

  // Direction from cell a to its neighbour b, allowing for wrap-around at the edges.
  function stepDir(a, b) {
    let dx = b.x - a.x, dy = b.y - a.y;
    if (dx > 1) dx = -1; else if (dx < -1) dx = 1;
    if (dy > 1) dy = -1; else if (dy < -1) dy = 1;
    return { x: dx, y: dy };
  }

  // How far through the current step the snake is (0 → 1). The snake is drawn gliding from
  // where it was to where it now is, so a turn always happens at the cell the head is entering.
  function glide() { return S.state === 'dead' ? 1 : Math.min(1, S.acc / interval()); }
  const ease = t => t * t * (3 - 2 * t);

  // Centres along the body from the head back to the tail (and the cell the tail just left),
  // unwrapped so a body crossing an edge in easy mode stays one continuous line.
  function bodyPath() {
    const sn = S.snake, cells = S.prevTail ? sn.concat([S.prevTail]) : sn;
    const pts = [center(sn[0])];
    for (let k = 1; k < cells.length; k++) {
      const d = stepDir(cells[k - 1], cells[k]), q = pts[k - 1];
      pts.push({ x: q.x + d.x * cell, y: q.y + d.y * cell });
    }
    return pts;
  }
  // The point d cells back from the head along the body.
  function at(pts, d) {
    if (pts.length < 2) return pts[0];
    d = Math.max(0, Math.min(pts.length - 1, d));
    const k = Math.min(pts.length - 2, Math.floor(d)), f = d - k, a = pts[k], b = pts[k + 1];
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
  }
  // The stretch of body between two such distances.
  function piece(pts, d1, d2) {
    const out = [at(pts, d1)];
    for (let k = Math.floor(d1) + 1; k < d2 && k < pts.length; k++) out.push(pts[k]);
    out.push(at(pts, d2));
    return out;
  }
  // Offsets that bring a box back onto the board. Off the board is only possible in easy mode,
  // where whatever pokes off one edge is drawn again coming in at the opposite one.
  const HERE = [{ x: 0, y: 0 }];
  function tiles(x0, y0, x1, y1, pad) {
    if (!S.mode.wrap) return HERE;
    const out = [];
    for (let i = Math.floor((x0 - pad) / W); i <= Math.floor((x1 + pad) / W); i++)
      for (let j = Math.floor((y0 - pad) / H); j <= Math.floor((y1 + pad) / H); j++) out.push({ x: -i * W, y: -j * H });
    return out;
  }
  function tracePieces(list, pad) {
    ctx.beginPath();
    for (const ps of list) {
      const xs = ps.map(q => q.x), ys = ps.map(q => q.y);
      for (const o of tiles(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), pad)) {
        ctx.moveTo(ps[0].x + o.x, ps[0].y + o.y);
        for (let k = 1; k < ps.length; k++) ctx.lineTo(ps[k].x + o.x, ps[k].y + o.y);
      }
    }
  }

  function drawSnake(now) {
    const items = S.items, L = items.length, p = glide();
    const dead = S.state === 'dead';
    const color = dead && Math.floor((now - S.deadAt) / 120) % 2 ? DEAD : INK;
    const pts = bodyPath();
    const lag = i => (i < S.grewAt ? 1 - p : 0);
    const dist = items.map((_, i) => i + lag(i));
    // One letter per square leaves gaps, so slide neighbouring letters together along the body
    // as in normal writing: joined letters touch, letters that don't join (ز و in عزوز) keep a
    // small gap. Letters behind move by the same amount, until a ـ stretch takes up the slack.
    const slide = new Array(L).fill(0);
    for (let i = 1, shift = 0; i < L; i++) {
      const a = items[i - 1], b = items[i];
      if (!b.letter) { shift = 0; continue; }
      if (a.letter) {
        const want = b.ja ? -0.03 : 0.08;
        const gap = dist[i] - dist[i - 1] - glyphInk(a.g).tail - glyphInk(b.g).head;
        if (gap > want) shift -= gap - want;
      }
      slide[i] = shift;
    }
    // Ease each letter into its place, so letters don't jump when a new ـ opens up in front.
    const dt = Math.min(100, Math.max(0, now - (S.slidAt || now))), k = Math.min(1, dt / 90);
    S.slidAt = now;
    items.forEach((it, i) => {
      if (!it.letter) return;
      const was = S.slide[it.k];
      S.slide[it.k] = was === undefined ? slide[i] : was + (slide[i] - was) * k;
      dist[i] += S.slide[it.k];
    });
    // Which way the body points at a spot, averaged over a cell so letters swing round corners.
    const fwd = d => {
      const a = at(pts, d - 0.5), b = at(pts, d + 0.5), x = a.x - b.x, y = a.y - b.y, n = Math.hypot(x, y);
      return n > 1e-6 ? { x: x / n, y: y / n } : S.lastDir;
    };

    // The body line runs only where letters join (and through the ـ stretch); letters that
    // don't join (ز و in عزوز) just sit apart, as in normal writing.
    const joined = [];
    let run = null;
    for (let i = 0; i < L - 1; i++) {
      if (!items[i + 1].ja) { run = null; continue; }
      const ps = piece(pts, dist[i], dist[i + 1]);
      if (run) run.push(...ps.slice(1)); else joined.push(run = ps);
    }
    ctx.save();
    ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = M.body;
    ctx.shadowColor = 'rgba(70,45,10,.25)'; ctx.shadowBlur = cell * 0.15; ctx.shadowOffsetY = cell * 0.08;
    tracePieces(joined, cell); ctx.stroke();
    ctx.restore();

    // Swallowed food: a lump that slides down to the tummy, swelling the letters it passes.
    const lumps = [];
    for (const b of S.bulges) {
      const bv = Math.min(target(b.spot), b.b + BULGE_STEP * p);
      if (bv > 0) lumps.push({ d: bv + lag(bv), amp: ease(Math.min(1, bv / 0.6)) });
    }
    if (S.settling !== null) lumps.push({ d: S.settling, amp: 1 - ease(p) });
    for (const l of lumps) {
      if (l.amp < 0.03) continue;
      const c = at(pts, l.d), f = fwd(l.d);
      for (const o of tiles(c.x, c.y, c.x, c.y, cell)) {
        ctx.beginPath();
        ctx.ellipse(c.x + o.x, c.y + o.y, cell * 0.36 * l.amp + M.body / 2, cell * 0.2 * l.amp + M.body / 2, Math.atan2(f.y, f.x), 0, Math.PI * 2);
        ctx.fillStyle = '#5fae84'; ctx.fill();
        ctx.lineWidth = Math.max(1.5, M.body * 0.4); ctx.strokeStyle = color; ctx.stroke();
      }
    }

    // The letters, each turned to face the way that part of the body is moving.
    ctx.font = `400 ${M.fs}px ${SNAKE_FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineJoin = 'round';
    for (let i = L - 1; i >= 0; i--) {
      const it = items[i];
      if (!it.letter) continue;
      const c = at(pts, dist[i]), f = fwd(dist[i]), sx = glyphScale(it.g);
      let swell = 0;
      for (const l of lumps) swell = Math.max(swell, l.amp * (1 - Math.abs(dist[i] - l.d)));
      const s = 1 + 0.25 * swell;
      for (const o of tiles(c.x, c.y, c.x, c.y, cell)) {
        ctx.save();
        ctx.translate(c.x + o.x, c.y + o.y);
        ctx.rotate(Math.atan2(-f.y, -f.x));
        ctx.scale(sx * s, s);
        ctx.fillText(it.g, 0, M.offY);
        ctx.restore();
      }
    }

    // Food the head is closing in on, shrinking between the open jaws.
    S.bulges.forEach(b => { if (b.b + BULGE_STEP * p < 0) drawEmoji(b.ch, b.cell, 0.85 - 0.4 * p); });

    const h = at(pts, dist[0]), f = fwd(dist[0]), px = -f.y, py = f.x;
    for (const o of tiles(h.x, h.y, h.x, h.y, cell * 1.5)) {
      const hx = h.x + o.x, hy = h.y + o.y;
      if (S.mouth > 0.03) {
        // Jaws opening in front of the head letter.
        const len = cell * 0.55 * Math.min(1, S.mouth * 2.5), a = S.mouth * 0.8;
        const jx = hx + f.x * cell * 0.32, jy = hy + f.y * cell * 0.32;
        const cs = Math.cos(a) * len, sn = Math.sin(a) * len;
        const ux = jx + f.x * cs + px * sn, uy = jy + f.y * cs + py * sn;
        const lx = jx + f.x * cs - px * sn, ly = jy + f.y * cs - py * sn;
        ctx.save();
        ctx.beginPath(); ctx.moveTo(jx, jy); ctx.lineTo(ux, uy); ctx.lineTo(lx, ly); ctx.closePath();
        ctx.fillStyle = '#b3302b'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(jx, jy); ctx.lineTo(lx, ly);
        ctx.strokeStyle = color; ctx.lineWidth = M.body; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
        ctx.restore();
      } else if (S.state === 'run' && now % 1500 < 260) {
        // A little tongue that flicks out now and then.
        const sx = hx + f.x * cell * 0.55, sy = hy + f.y * cell * 0.55;
        const ex = sx + f.x * cell * 0.3, ey = sy + f.y * cell * 0.3;
        ctx.save();
        ctx.strokeStyle = '#d63b3b'; ctx.lineWidth = Math.max(1.5, cell * 0.07); ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
        ctx.moveTo(ex, ey); ctx.lineTo(ex + f.x * cell * 0.13 + px * cell * 0.1, ey + f.y * cell * 0.13 + py * cell * 0.1);
        ctx.moveTo(ex, ey); ctx.lineTo(ex + f.x * cell * 0.13 - px * cell * 0.1, ey + f.y * cell * 0.13 - py * cell * 0.1);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // Open wide when food is just ahead, and keep it open until the food is in.
  function mouthWant() {
    if (S.bulges.some(b => b.b < 0)) return 1;
    const d = S.queue[0] || S.dir;
    let c = S.snake[0];
    for (let k = 1; k <= 2; k++) {
      c = { x: c.x + d.x, y: c.y + d.y };
      if (S.mode.wrap) c = { x: (c.x + COLS) % COLS, y: (c.y + rows) % rows };
      if (same(S.food, c) || same(S.coffee, c)) return k === 1 ? 1 : 0.55;
    }
    return 0;
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    drawBoard();
    if (!S) return;
    S.rocks.forEach(drawRock);

    if (S.food) {
      const t = Math.min(1, (now - S.food.born) / 180);
      drawEmoji(S.food.ch, S.food, (1 - Math.pow(1 - t, 3)) * (1 + 0.05 * Math.sin(now / 240)));
    }
    if (S.coffee) {
      const c = center(S.coffee);
      const pulse = 0.5 + 0.5 * Math.sin(now / 200);
      ctx.save();
      ctx.fillStyle = `rgba(255, 200, 90, ${0.25 + 0.2 * pulse})`;
      ctx.beginPath(); ctx.arc(c.x, c.y, cell * 0.62, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#6b3f1f'; ctx.lineWidth = Math.max(2, cell * 0.08); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(c.x, c.y, cell * 0.62, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (S.coffee.left / COFFEE_MS)); ctx.stroke();
      ctx.restore();
      drawEmoji('☕', S.coffee, 0.95);
    }
    drawSnake(now);

    S.particles = S.particles.filter(p => now - p.born < 500);
    S.particles.forEach(p => {
      const t = now - p.born;
      ctx.globalAlpha = 1 - t / 500;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x + p.vx * t / 16, p.y + p.vy * t / 16, cell * 0.1, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    S.floaters = S.floaters.filter(f => now - f.born < 800);
    S.floaters.forEach(f => {
      const t = (now - f.born) / 800;
      ctx.globalAlpha = 1 - t;
      ctx.font = `800 ${Math.round(cell * 0.75)}px Tajawal, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#3b2a1a';
      ctx.fillText(f.text, f.x, f.y - cell * 0.6 - t * cell * 1.2);
    });
    ctx.globalAlpha = 1;
  }

  // ---------- loop ----------
  let shownSlow = -1;
  function frame(now) {
    requestAnimationFrame(frame);
    if (S && S.state === 'run') {
      const dt = Math.min(250, now - S.last);
      S.last = now;
      if (S.slowLeft > 0) S.slowLeft -= dt;
      if (S.coffee && (S.coffee.left -= dt) <= 0) S.coffee = null;
      S.acc += dt;
      let iv = interval();
      while (S.acc >= iv && S.state === 'run') { S.acc -= iv; step(now); iv = interval(); }
      if (S.state === 'run') S.mouth += (mouthWant() - S.mouth) * Math.min(1, dt / 70);
      const sl = S.slowLeft > 0 ? Math.ceil(S.slowLeft / 1000) : 0;
      if (sl !== shownSlow) { shownSlow = sl; $('slow').hidden = !sl; $('slowN').textContent = sl; }
    } else if (S) {
      S.last = now;
    }
    draw(now);
  }

  // ---------- screens ----------
  let titleTimer = null;
  function show(id) {
    ['start', 'pause', 'over'].forEach(s => { $(s).hidden = s !== id; });
    clearInterval(titleTimer);
    if (id === 'start') {
      ['easy', 'normal', 'hard'].forEach(k => { $('best-' + k).textContent = best[k] || 0; });
      let n = 0;
      renderPreview(0);
      titleTimer = setInterval(() => { n = (n + 1) % 9; renderPreview(n); }, 380);
    }
  }
  // The start screen shows the typed name stretching, so players see what will happen.
  function renderPreview(n) {
    const name = cleanName(nameInput.value);
    $('leadName').textContent = name || 'الثعبان';
    $('namePreview').textContent = name ? stretched(name, n) : '';
  }
  function updateHud() {
    $('score').textContent = S ? S.score : 0;
    $('best').textContent = S ? Math.max(best[S.modeKey] || 0, S.score) : 0;
  }
  function showGameOver(isBest, said) {
    if (!S || S.state !== 'dead') return;
    $('overTitle').textContent = S.won ? `ملأ ${S.name} الملعب! 🏆` : 'انتهت اللعبة';
    const nameEl = $('overName');
    nameEl.textContent = stretched(S.name, S.score);
    nameEl.style.fontSize = Math.max(24, 56 - S.score * 1.1 - Math.max(0, S.name.length - 3) * 4) + 'px';
    $('overScore').textContent = S.score;
    $('overBestLabel').textContent = 'الأفضل (' + S.mode.name + ')';
    $('overBest').textContent = best[S.modeKey] || 0;
    $('newBest').hidden = !isBest;
    show('over');
    // A new record still gets its fanfare, once the taunt has finished.
    if (isBest) setTimeout(sfx.best, Math.max(0, (said || 0) * 1000 - 750));
  }
  function pause() {
    if (!S || S.state !== 'run') return;
    S.state = 'paused';
    show('pause');
  }
  function resume() {
    if (!S || S.state !== 'paused') return;
    initAudio();
    S.state = 'run';
    show(null);
  }
  function toMenu() {
    if (S) S.state = 'menu';
    show('start');
  }

  function shareScore() {
    if (!S) return;
    const link = /^https?:$/.test(location.protocol) ? location.href.split('#')[0] : '';
    const text = `صار اسمي ${stretched(S.name, S.score)} 🐍\nجمعت ${S.score} نقطة في لعبة حيّه (${S.mode.name})` +
      (link ? `\nجرّبها: ${link}` : '');
    if (navigator.share) navigator.share({ text }).catch(() => {});
    // wa.me's redirect garbles emoji, so go straight to the full address.
    else window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
  }

  // ---------- input ----------
  // Name box: Arabic letters only, up to MAX_NAME. Only rewrite the box when something had to be
  // removed, so phone keyboards that compose words as you type are left alone.
  const nameInput = $('nameInput');
  nameInput.value = store.get('saad.name', 'سعد');
  function nameMsg(text) { $('nameMsg').textContent = text || ''; $('nameMsg').hidden = !text; }
  function tidyName() {
    const raw = nameInput.value, letters = stripMarks(raw), clean = cleanName(raw);
    if (clean !== raw) nameInput.value = clean;
    if (/[^ء-غف-ي]/.test(letters)) nameMsg('حروف عربية فقط');
    else if (letters.length > MAX_NAME) nameMsg(`${MAX_NAME} حروف على الأكثر`);
    else nameMsg('');
    renderPreview(0);
  }
  nameInput.addEventListener('input', e => { if (!e.isComposing) tidyName(); });
  nameInput.addEventListener('compositionend', tidyName);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') nameInput.blur(); });

  function startGame(modeKey) {
    const name = cleanName(nameInput.value);
    if (!name) { nameMsg('اكتب الاسم أولًا'); nameInput.focus(); return; }
    store.set('saad.name', name);
    // Let the phone keyboard close first, so the board is sized for the full screen.
    if (document.activeElement === nameInput) { nameInput.blur(); setTimeout(() => newGame(modeKey, name), 300); }
    else newGame(modeKey, name);
  }
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => startGame(b.dataset.mode)));
  $('again').addEventListener('click', () => newGame(S ? S.modeKey : 'normal', S ? S.name : 'سعد'));
  $('share').addEventListener('click', shareScore);
  $('overMenu').addEventListener('click', toMenu);
  $('pauseMenu').addEventListener('click', toMenu);
  $('resume').addEventListener('click', resume);
  $('pauseBtn').addEventListener('click', () => (S && S.state === 'paused') ? resume() : pause());
  $('mute').addEventListener('click', () => {
    muted = !muted; store.set('saad.muted', muted); renderMute();
    if (!muted) { initAudio(); sfx.tap(); }
  });

  // Two-side controls: tap the left half of the screen to turn to the snake's left, the right
  // half to turn to its right.
  $('app').addEventListener('pointerdown', e => {
    if (!S || S.state !== 'run' || e.target.closest('button')) return;
    e.preventDefault();
    turnSide(e.clientX < window.innerWidth / 2 ? 'left' : 'right');
  });
  document.addEventListener('touchmove', e => { if (S && S.state === 'run') e.preventDefault(); }, { passive: false });

  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  document.addEventListener('keydown', e => {
    if (e.target === nameInput) return;
    if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); }
    else if (e.key === ' ' || e.key === 'Escape') { (S && S.state === 'paused') ? resume() : pause(); }
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('resize', () => { fitBoard(!S || S.state === 'menu'); });

  // ---------- start ----------
  renderMute();
  const fontReady = document.fonts && document.fonts.load
    ? Promise.race([document.fonts.load(`400 40px "Reem Kufi"`, 'سعد'), new Promise(r => setTimeout(r, 2500))])
    : Promise.resolve();
  fontReady.catch(() => {}).then(() => {
    fitBoard(true);
    show('start');
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
